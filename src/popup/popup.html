<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Meter Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor" class="logo-bolt"/>
        </svg>
        <span>Smart Meter <span class="accent">Analytics</span></span>
      </div>
      <button id="refresh-btn" class="icon-btn" title="Refresh Data">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </header>

    <div id="loading-state" class="state-container">
      <div class="loader"></div>
      <p>Fetching data...</p>
    </div>

    <div id="error-state" class="state-container hidden">
      <div class="icon">⚠️</div>
      <p id="error-message">Unable to load data.</p>
    </div>

    <div id="auth-state" class="state-container hidden">
      <div class="icon">🔒</div>
      <p>Please open the <br><a href="https://core.polarisgrids.com" target="_blank" class="link">CORE Portal</a><br> and log in.</p>
    </div>

    <main id="main-content" class="hidden">
      <div class="data-grid">
        <div class="data-box primary-box">
          <div class="box-label">Today's Consumption</div>
          <div class="box-value" id="today-kwh">—</div>
          <div class="box-sub" id="today-cost">—</div>
        </div>
        
        <div class="data-box">
          <div class="box-label">Wallet Balance</div>
          <div class="box-value" id="wallet-balance">—</div>
          <div class="box-sub" id="wallet-estimate">—</div>
        </div>
      </div>

      <div class="power-row">
        <div class="power-item">
          <span class="power-label">Latest Power:</span>
          <span class="power-val" id="latest-power">—</span>
        </div>
        <div class="power-item">
          <span class="power-label">Peak Power:</span>
          <span class="power-val" id="peak-power">—</span>
        </div>
      </div>

      <div class="footer-actions">
        <button id="open-dashboard-btn" class="btn btn-full">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          Open Full Dashboard
        </button>
      </div>
      
      <div class="update-time">
        Updated: <span id="last-updated">—</span>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
